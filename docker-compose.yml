version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: pringsewu-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass hR9tF4uZp2Xq
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "hR9tF4uZp2Xq", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pringsewu-network

  pringsewu-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pringsewu-backend
    restart: unless-stopped
    ports:
      - "5144:5144"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RedisSettings__Host=redis
      - RedisSettings__Port=6379
      - RedisSettings__DefaultDatabase=1
      - RedisSettings__SecretManager__Provider=AppSettings
      - RedisSettings__SecretManager__AppSettingSecret__Password=hR9tF4uZp2Xq
      - VaFundApi__BaseUrl=${VAFUND_API_URL:-http://host.docker.internal:3000}
      - Midtrans__ServerKey=${MIDTRANS_SERVER_KEY:-}
      - Midtrans__ClientKey=${MIDTRANS_CLIENT_KEY:-}
      - Midtrans__IsProduction=${MIDTRANS_IS_PRODUCTION:-false}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pringsewu-network

networks:
  pringsewu-network:
    driver: bridge

volumes:
  redis_data:
